plugins {
    id 'io.freefair.lombok' version '9.4.0'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin'
    id 'io.sentry.jvm.gradle' version '6.5.0'
}

// Replaces application.yml @version@  with version from gradle.properties
processResources {
    filesMatching('application.yml') {
        filter {
            it.replace('@version@', version)
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/LaaCcmsApiGatewayApplication.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/LaaCcmsApiGatewayApplication.class'])
        }))
    }
}

dependencies {

    // Ensures compatibility across architectures by conditionally including dependencies
    if (System.getProperty("os.name").toLowerCase().contains("mac") &&
    System.getProperty("os.arch").toLowerCase().contains("aarch64")) {
        runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.107.Final:osx-aarch_64'
    }

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    // Source: https://mvnrepository.com/artifact/org.springframework.cloud/spring-cloud-dependencies
    implementation(platform("org.springframework.cloud:spring-cloud-dependencies:2025.1.1"))


    // Required for tracing information
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // temporary dependency overrides see README
    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.2'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.21'
    implementation 'tools.jackson.core:jackson-core:3.1.2'

    runtimeOnly 'com.h2database:h2'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}
